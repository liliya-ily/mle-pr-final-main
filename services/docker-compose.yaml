version: "3.9"

services:
  ml_service:
    build:
      context: .
      dockerfile: Dockerfile_ml_service
    env_file:
      - ./.env
    ports:
      - "4601:8081"
    hostname: ml_service

  prometheus:
    image: prom/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    hostname: prometheus
    depends_on:
      - ml_service

